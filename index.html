<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - OB Montessori</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-card">

        <div class="login-left">
            <h2>Login</h2>
            <p>Please enter your details below</p>

            <img src="OBMC 60 Icon_Circle.png" class="login-logo">

            <div class="input-group">
                <label>Student ID:</label>
                <input type="text" id="username">
            </div>

            <div class="input-group">
                <label>Password:</label>
                <input type="password" id="password">
            </div>

            <div class="login-options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#" style="color:white;">Forgot password?</a>
            </div>

            <p id="errorMsg" style="color:rgb(250, 30, 30);"></p>

            <button class="login-btn" onclick="login()">LOGIN</button>
        </div>

        <div class="login-right">
            <div class="welcome-text">
                <h1>Welcome back!</h1>
                <p>
                    Continue nurturing young minds and exploring new ways 
                    to inspire at <b>OB Montessori Center</b>.
                </p>
                <small>Not a member yet? <a href="#" style="color:white;">Register now</a></small> <br> <br> <br>
            </div>
        </div>

    </div>

    <footer class="login-footer">
        <p>Bae & Santos² | 9 - Emerald © 2026</p>
        <small>Source: Shutter.com, flaticon.com, AI:ChatGPT, OBMC</small>
    </footer>

    <script>
        let attempt = 0;
        const MaxTry = 3;
        
        function login() {
            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;
            let error = document.getElementById("errorMsg");
        
            if (attempt >= MaxTry) {
                alert("🔒 Account Locked. Too many failed attempts.");
                return;
            }
        
            if (user === "1504983384" && pass === "12345") {
                error.textContent = "";
                attempt = 0;
                window.location.href = "Dashboard.html";
            } else {
                attempt++;
        
                if (attempt < MaxTry) {
                    error.textContent = " Invalid Credentials. Attempts left: " + (MaxTry - attempt);
                } else {
                    error.textContent = " Account Locked. Too many failed attempts.";
                }
            }
        }
        </script>

</body>
</html>
